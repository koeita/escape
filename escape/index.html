<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>古びた書斎と賢者の鍵 - 脱出ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- ヘッダー情報 -->
    <header id="game-header">
      <div class="title-area">
        <h1>古びた書斎と賢者の鍵</h1>
        <span class="room-direction" id="current-direction-text">正面 (北)</span>
      </div>
      <div class="header-controls">
        <button id="btn-sound" class="btn-icon" title="音量切替">🔊</button>
        <button id="btn-restart" class="btn-icon" title="最初からやり直す">🔄</button>
      </div>
    </header>

    <!-- メインビューポート -->
    <div id="viewport-wrapper">
      <!-- 左右の視点切り替えボタン -->
      <button id="btn-turn-left" class="nav-arrow left" aria-label="左を向く">❮</button>
      <button id="btn-turn-right" class="nav-arrow right" aria-label="右を向く">❯</button>

      <!-- 部屋のシーンコンテナ -->
      <div id="room-scene">
        <!-- 北：脱出の大扉と古時計 -->
        <div class="direction-view" id="view-north">
          <svg class="scene-bg" viewBox="0 0 800 500">
            <!-- 部屋の壁と床 -->
            <rect x="0" y="0" width="800" height="380" fill="#2b231d"/>
            <polygon points="0,380 800,380 720,340 80,340" fill="#3a2f26" opacity="0.3"/>
            <rect x="0" y="380" width="800" height="120" fill="#1d1712"/>
            <!-- 巾木とモールディング -->
            <rect x="0" y="370" width="800" height="10" fill="#4a3b2c"/>
            <line x1="80" y1="0" x2="80" y2="370" stroke="#1d1611" stroke-width="3"/>
            <line x1="720" y1="0" x2="720" y2="370" stroke="#1d1611" stroke-width="3"/>

            <!-- 脱出の大扉 (中央) -->
            <g id="obj-door" class="interactive" tabindex="0">
              <!-- ドア枠 -->
              <rect x="310" y="80" width="180" height="290" fill="#3c2616" stroke="#180f08" stroke-width="5"/>
              <path d="M 310,120 Q 400,60 490,120 L 490,370 L 310,370 Z" fill="#4e321e" stroke="#25160d" stroke-width="3"/>
              <!-- ドアパネル彫刻 -->
              <rect x="330" y="140" width="60" height="80" fill="#3e2716" stroke="#23140a" stroke-width="2"/>
              <rect x="410" y="140" width="60" height="80" fill="#3e2716" stroke="#23140a" stroke-width="2"/>
              <rect x="330" y="240" width="60" height="100" fill="#3e2716" stroke="#23140a" stroke-width="2"/>
              <rect x="410" y="240" width="60" height="100" fill="#3e2716" stroke="#23140a" stroke-width="2"/>
              <!-- ドアノブと頑丈な鍵穴 -->
              <circle cx="335" cy="235" r="9" fill="#c29b38" stroke="#684f13" stroke-width="2"/>
              <circle cx="335" cy="235" r="3" fill="#111"/>
              <!-- ダイヤル式電子錠プレート -->
              <rect x="330" y="200" width="30" height="20" fill="#222" rx="3" stroke="#888" stroke-width="1.5"/>
              <text id="door-lock-status-led" x="345" y="214" font-size="10" text-anchor="middle" fill="#e74c3c" font-family="monospace">● LOCKED</text>
            </g>

            <!-- 壁掛けの古時計 (右側の壁) -->
            <g id="obj-clock" class="interactive" tabindex="0">
              <!-- 時計本体木枠 -->
              <rect x="560" y="90" width="90" height="180" fill="#5c381e" stroke="#241407" stroke-width="3" rx="8"/>
              <!-- 時計文字盤外枠 -->
              <circle cx="605" cy="145" r="36" fill="#f4ebd9" stroke="#b89344" stroke-width="4"/>
              <!-- 文字盤の点 -->
              <circle cx="605" cy="115" r="2.5" fill="#333"/>
              <circle cx="635" cy="145" r="2.5" fill="#333"/>
              <circle cx="605" cy="175" r="2.5" fill="#333"/>
              <circle cx="575" cy="145" r="2.5" fill="#333"/>
              <!-- 時計の針 (初期表示) -->
              <line id="clock-mini-hour" x1="605" y1="145" x2="605" y2="128" stroke="#111" stroke-width="3" stroke-linecap="round"/>
              <line id="clock-mini-min" x1="605" y1="145" x2="626" y2="145" stroke="#222" stroke-width="2" stroke-linecap="round"/>
              <circle cx="605" cy="145" r="3.5" fill="#b89344"/>
              <!-- 下部振り子室のガラス窓 -->
              <rect x="580" y="195" width="50" height="65" fill="#1b120c" stroke="#3d2616" stroke-width="2" rx="3"/>
              <!-- 振り子 -->
              <line x1="605" y1="195" x2="605" y2="235" stroke="#c29b38" stroke-width="2"/>
              <circle cx="605" cy="240" r="10" fill="#d4af37" stroke="#876d1e" stroke-width="1.5"/>
            </g>

            <!-- 壁のランプ (左側) -->
            <g id="obj-lamp-left">
              <path d="M 180,140 L 200,120 L 220,140 Z" fill="#c29b38"/>
              <polygon points="185,140 215,140 225,180 175,180" fill="#fff8db" opacity="0.85"/>
              <circle cx="200" cy="160" r="18" fill="#ffeaa7" opacity="0.4" filter="blur(4px)"/>
            </g>
          </svg>
        </div>

        <!-- 東：本棚とアンティーク机 -->
        <div class="direction-view" id="view-east" style="display: none;">
          <svg class="scene-bg" viewBox="0 0 800 500">
            <!-- 部屋の壁と床 -->
            <rect x="0" y="0" width="800" height="380" fill="#2b231d"/>
            <rect x="0" y="380" width="800" height="120" fill="#1d1712"/>
            <rect x="0" y="370" width="800" height="10" fill="#4a3b2c"/>

            <!-- 本棚 (左側) -->
            <g id="obj-bookshelf" class="interactive" tabindex="0">
              <!-- 本棚外枠 -->
              <rect x="90" y="70" width="230" height="300" fill="#4a2e1b" stroke="#26150a" stroke-width="4"/>
              <!-- 棚板 -->
              <rect x="95" y="145" width="220" height="12" fill="#5d3c24"/>
              <rect x="95" y="220" width="220" height="12" fill="#5d3c24"/>
              <rect x="95" y="295" width="220" height="12" fill="#5d3c24"/>

              <!-- 最上段の並び本 (赤・青・黄・緑の仕掛け本) -->
              <g id="mini-puzzle-books">
                <rect x="115" y="88" width="22" height="57" fill="#b03a2e" stroke="#5c1d16" rx="1"/> <!-- 赤 -->
                <rect x="140" y="93" width="20" height="52" fill="#2471a3" stroke="#153e5a" rx="1"/> <!-- 青 -->
                <rect x="163" y="85" width="24" height="60" fill="#d4ac0d" stroke="#6f5a07" rx="1"/> <!-- 黄 -->
                <rect x="190" y="90" width="22" height="55" fill="#229954" stroke="#12532d" rx="1"/> <!-- 緑 -->
                <rect x="215" y="92" width="18" height="53" fill="#6e2c00" stroke="#381600" rx="1"/>
                <rect x="236" y="87" width="26" height="58" fill="#512e5f" stroke="#28172f" rx="1"/>
                <rect x="265" y="95" width="20" height="50" fill="#784212" stroke="#402309" rx="1"/>
              </g>

              <!-- 中段・下段の一般的な本 -->
              <g opacity="0.85">
                <rect x="110" y="160" width="30" height="60" fill="#5d4037"/>
                <rect x="143" y="165" width="25" height="55" fill="#455a64"/>
                <rect x="171" y="158" width="28" height="62" fill="#37474f"/>
                <rect x="202" y="163" width="35" height="57" fill="#8d6e63"/>
                <rect x="240" y="160" width="40" height="60" fill="#4e342e"/>

                <rect x="115" y="240" width="35" height="55" fill="#2c3e50"/>
                <rect x="153" y="235" width="28" height="60" fill="#795548"/>
                <rect x="184" y="242" width="32" height="53" fill="#3e2723"/>
                <rect x="220" y="238" width="45" height="57" fill="#1b2631"/>
              </g>
            </g>

            <!-- 書斎机 (右側) -->
            <g id="obj-desk" class="interactive" tabindex="0">
              <!-- 机の天板 -->
              <polygon points="390,270 710,270 740,300 360,300" fill="#6a4427" stroke="#331e0f" stroke-width="2"/>
              <rect x="360" y="300" width="380" height="25" fill="#57361d" stroke="#2b190c" stroke-width="2"/>
              <!-- 引き出し部分 -->
              <rect x="560" y="325" width="160" height="110" fill="#4d3019" stroke="#271609" stroke-width="2"/>
              <rect x="575" y="335" width="130" height="40" fill="#5e3c20" stroke="#301c0c" stroke-width="1.5"/>
              <rect x="575" y="385" width="130" height="40" fill="#5e3c20" stroke="#301c0c" stroke-width="1.5"/>
              <!-- 引き出しの取っ手・鍵穴 -->
              <circle cx="640" cy="355" r="5" fill="#c29b38"/>
              <path d="M 638,358 L 642,358 L 641,363 L 639,363 Z" fill="#111"/> <!-- 鍵穴 -->
              <rect x="625" y="402" width="30" height="6" fill="#c29b38" rx="2"/>

              <!-- 机の脚 -->
              <rect x="380" y="325" width="25" height="130" fill="#3a2211"/>
              <rect x="420" y="325" width="20" height="120" fill="#2b180a"/>
              <rect x="695" y="435" width="20" height="20" fill="#2b180a"/>
              <rect x="565" y="435" width="20" height="20" fill="#2b180a"/>

              <!-- 机の上の小物（スタンドライト、開かれた古書） -->
              <!-- デスクライト -->
              <path d="M 430,270 Q 430,210 460,200" stroke="#c29b38" stroke-width="4" fill="none"/>
              <path d="M 450,195 L 480,205 L 465,225 Z" fill="#2e7d32" stroke="#1b4d1f"/>
              <polygon points="460,220 485,210 520,280 430,280" fill="#fff9c4" opacity="0.3"/>
              <!-- 机の上の手帳 -->
              <polygon points="500,278 545,274 555,290 510,295" fill="#f5f5dc" stroke="#5d4037"/>
            </g>
          </svg>
        </div>

        <!-- 南：暖炉と絵画 -->
        <div class="direction-view" id="view-south" style="display: none;">
          <svg class="scene-bg" viewBox="0 0 800 500">
            <!-- 部屋の壁と床 -->
            <rect x="0" y="0" width="800" height="380" fill="#2b231d"/>
            <rect x="0" y="380" width="800" height="120" fill="#1d1712"/>
            <rect x="0" y="370" width="800" height="10" fill="#4a3b2c"/>

            <!-- 壁の絵画 (上部中央) -->
            <g id="obj-painting" class="interactive" tabindex="0">
              <!-- 重厚な金縁フレーム -->
              <rect x="300" y="40" width="200" height="150" fill="#b78727" stroke="#684a0d" stroke-width="5" rx="3"/>
              <rect x="312" y="52" width="176" height="126" fill="#181310"/>
              <!-- 絵画の内容（賢者と天体のシンボル、針の暗示） -->
              <path d="M 312,178 L 360,110 L 420,150 L 488,90 L 488,178 Z" fill="#2e4053"/>
              <circle cx="430" cy="90" r="22" fill="#f9e79f" opacity="0.9"/>
              <!-- 時計のヒント（絵画内の尖塔の針：9時15分を示唆） -->
              <line x1="430" y1="90" x2="430" y2="74" stroke="#78281f" stroke-width="3" stroke-linecap="round"/>
              <line x1="430" y1="90" x2="446" y2="90" stroke="#78281f" stroke-width="2" stroke-linecap="round"/>
              <text x="400" y="165" font-size="11" fill="#ecf0f1" font-family="serif" text-anchor="middle" opacity="0.8">『星辰の刻』</text>
            </g>

            <!-- 暖炉 (中央下部) -->
            <g id="obj-fireplace" class="interactive" tabindex="0">
              <!-- マントルピース（暖炉枠石造り） -->
              <rect x="250" y="210" width="300" height="165" fill="#5d646b" stroke="#34383c" stroke-width="4"/>
              <rect x="230" y="198" width="340" height="20" fill="#757d87" stroke="#34383c" stroke-width="2"/>
              <!-- 火室（炉の内側） -->
              <path d="M 300,375 L 300,280 Q 400,245 500,280 L 500,375 Z" fill="#1b1c1e"/>
              <!-- 薪と灰 -->
              <ellipse cx="400" cy="360" rx="75" ry="18" fill="#424242" id="fireplace-ash-layer"/>
              <!-- 焦げた薪 -->
              <rect x="350" y="348" width="80" height="14" fill="#212121" transform="rotate(-8 390 355)"/>
              <rect x="370" y="348" width="80" height="14" fill="#2c2523" transform="rotate(12 410 355)"/>
              <!-- 灰の下に隠された金属プレートのチラ見せ -->
              <rect id="fireplace-plate-hint" x="385" y="353" width="30" height="14" fill="#a6acaf" opacity="0" stroke="#17202a"/>
            </g>
          </svg>
        </div>

        <!-- 西：ソファ・テーブルと絨毯 -->
        <div class="direction-view" id="view-west" style="display: none;">
          <svg class="scene-bg" viewBox="0 0 800 500">
            <!-- 部屋の壁と床 -->
            <rect x="0" y="0" width="800" height="380" fill="#2b231d"/>
            <rect x="0" y="380" width="800" height="120" fill="#1d1712"/>
            <rect x="0" y="370" width="800" height="10" fill="#4a3b2c"/>

            <!-- 高級感のある革張りソファ (中央後方) -->
            <g id="obj-sofa">
              <!-- 背もたれ -->
              <rect x="240" y="210" width="320" height="120" rx="15" fill="#6e2d22" stroke="#3e1710" stroke-width="3"/>
              <!-- ボタン留めクッション風ステッチ -->
              <circle cx="290" cy="245" r="4" fill="#3e1710"/>
              <circle cx="360" cy="245" r="4" fill="#3e1710"/>
              <circle cx="440" cy="245" r="4" fill="#3e1710"/>
              <circle cx="510" cy="245" r="4" fill="#3e1710"/>
              <circle cx="325" cy="285" r="4" fill="#3e1710"/>
              <circle cx="400" cy="285" r="4" fill="#3e1710"/>
              <circle cx="475" cy="285" r="4" fill="#3e1710"/>
              <!-- 座面 -->
              <rect x="230" y="310" width="340" height="60" rx="8" fill="#823528" stroke="#3e1710" stroke-width="2"/>
              <!-- 肘掛け -->
              <rect x="210" y="260" width="45" height="100" rx="12" fill="#58231a" stroke="#2b0e0a" stroke-width="2"/>
              <rect x="545" y="260" width="45" height="100" rx="12" fill="#58231a" stroke="#2b0e0a" stroke-width="2"/>
              <!-- 脚 -->
              <rect x="240" y="370" width="15" height="20" fill="#23130c"/>
              <rect x="545" y="370" width="15" height="20" fill="#23130c"/>
            </g>

            <!-- 床のペルシャ風絨毯 (手前) -->
            <g id="obj-carpet" class="interactive" tabindex="0">
              <polygon points="180,390 620,390 700,480 100,480" fill="#8b1e1e" stroke="#c0392b" stroke-width="3"/>
              <!-- 絨毯の模様 -->
              <polygon points="210,400 590,400 660,470 140,470" fill="#c0392b" stroke="#f39c12" stroke-width="2"/>
              <ellipse cx="400" cy="435" rx="110" ry="25" fill="#f1c40f" opacity="0.3"/>
              <!-- めくれる角（右下コーナー） -->
              <polygon id="carpet-corner-flat" points="670,455 700,480 645,480" fill="#962d22" stroke="#f39c12" stroke-width="1.5"/>
              <polygon id="carpet-corner-folded" points="670,455 645,480 655,450" fill="#e0d0b0" stroke="#888" stroke-width="1.5" style="display:none;"/>
              <!-- めくった下に見える銀の鍵 -->
              <g id="carpet-silver-key" style="display: none;">
                <ellipse cx="675" cy="468" rx="8" ry="5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
                <line x1="675" y1="468" x2="688" y2="473" stroke="#bdc3c7" stroke-width="3" stroke-linecap="round"/>
                <line x1="685" y1="472" x2="684" y2="476" stroke="#bdc3c7" stroke-width="2"/>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- メッセージバー -->
      <div id="message-bar">古びた書斎に閉じ込められているようだ。手掛かりを探して脱出しよう。</div>
    </div>

    <!-- アイテムインベントリ -->
    <div id="inventory-bar">
      <div class="inventory-title">所持アイテム</div>
      <div id="item-slots">
        <!-- 6スロット用意 -->
        <div class="item-slot" data-slot="0"></div>
        <div class="item-slot" data-slot="1"></div>
        <div class="item-slot" data-slot="2"></div>
        <div class="item-slot" data-slot="3"></div>
        <div class="item-slot" data-slot="4"></div>
        <div class="item-slot" data-slot="5"></div>
      </div>
    </div>
  </div>

  <!-- ズーム・詳細モーダルダイアログ -->
  <div id="modal-overlay" class="modal-hidden">
    <div id="modal-container">
      <button id="modal-close" class="modal-close-btn" aria-label="閉じる">&times;</button>
      <div id="modal-content">
        <!-- JSで動的にズームコンテンツを切り替え -->
      </div>
    </div>
  </div>

  <!-- アイテム詳細モーダル -->
  <div id="item-detail-modal" class="modal-hidden">
    <div class="item-detail-card">
      <button id="item-detail-close" class="modal-close-btn">&times;</button>
      <div id="item-detail-icon"></div>
      <h3 id="item-detail-name">アイテム名</h3>
      <p id="item-detail-desc">アイテムの説明文がここに入ります。</p>
    </div>
  </div>

  <!-- ゲームクリア演出モーダル -->
  <div id="game-clear-modal" class="modal-hidden">
    <div class="clear-card">
      <h2>ESCAPE SUCCESS!</h2>
      <div class="clear-icon">🗝️🚪✨</div>
      <p>扉の重い鍵が開き、冷涼な夜風が吹き込んできた。</p>
      <p class="congrats-text">お見事！ 書斎の謎をすべて解き明かし、脱出に成功しました！</p>
      <div class="clear-time" id="clear-time-display">脱出タイム: 00:00</div>
      <button id="btn-play-again" class="btn-primary">もう一度遊ぶ</button>
    </div>
  </div>

  <script src="se.js"></script>
  <script src="script.js"></script>
</body>
</html>
